name: Feature request / 功能建议
description: An idea for something new or better / 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with / 想解决什么问题
      description: What you are trying to do, and what gets in the way now. / 你想做什么，现在哪里不方便。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea / 你的想法
      description: How you would like it to work. Screenshots of other apps are welcome. / 你希望它怎么用。可以附上别的软件的截图。
    validations:
      required: true
