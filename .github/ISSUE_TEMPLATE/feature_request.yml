name: Feature request / 功能建议
description: An idea for something new or better / 想要的新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Lumtub is free and built by one person. Every idea is read, but there is no promise that it will be built, nor when. Requests from [sponsors](https://github.com/0x696c757a696f/lumtub#support-lumtub) are worked on first.
        Lumtub 是一个人免费做的。每条建议都会看，但不保证实现，也没有时间表。[赞助者](https://github.com/0x696c757a696f/lumtub/blob/main/README.zh-Hans.md#支持-lumtub)的建议优先处理。
  - type: textarea
    id: problem
    attributes:
      label: What would it help with / 想解决什么问题
      description: What you are trying to do, and what gets in the way now. / 你想做什么，现在哪里不方便。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea / 你的想法
      description: How you would like it to work. Screenshots of other apps are welcome. / 你希望它怎么用。可以附上别的软件的截图。
    validations:
      required: true
