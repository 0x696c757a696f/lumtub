version: 2
# Every ecosystem waits a week after a release before proposing it: a
# poisoned release is usually found and pulled within days, and green
# Dependabot pull requests are merged automatically (dependabot-merge.yml).
# Security updates are not held back.
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /native/lumtub_core
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ['*']
    open-pull-requests-limit: 5

  # The Android Gradle plugin, Kotlin and AndroidX; the Android job in Build
  # judges them.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      android:
        patterns: ['*']
    open-pull-requests-limit: 5

  # ESLint for the repository's JavaScript (Checks › Analyze).
  - package-ecosystem: npm
    directory: /.github/lint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      lint:
        patterns: ['*']
    open-pull-requests-limit: 5
