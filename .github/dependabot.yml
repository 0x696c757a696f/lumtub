version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /native/lumtub_core
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
    open-pull-requests-limit: 5
