version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /native/lumtub_core
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
    open-pull-requests-limit: 5

  # The Android Gradle plugin, Kotlin and AndroidX; the Android job in Build
  # judges them.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ['*']
    open-pull-requests-limit: 5
