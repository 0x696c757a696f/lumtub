name: Retry and report

# Watches the runs nobody is looking at: scheduled checks, main, release
# tags and the branches the bots keep (deps/*). A run that fails is run
# again, up to three attempts with a wait before each; when the last one
# fails too, an issue labelled `automation` says so (one per workflow,
# commented on again when it keeps failing), and the next run that passes
# closes it.
on:
  workflow_run:
    workflows: [Build, Refresh lockfiles, Audit, Create release, Block lists, YouTube canary, Upstream updates]
    types: [completed]

permissions:
  actions: write
  issues: write

jobs:
  watch:
    if: >-
      github.event.workflow_run.event == 'schedule' ||
      startsWith(github.event.workflow_run.head_branch, 'deps/') ||
      startsWith(github.event.workflow_run.head_branch, 'v') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Retry or report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          title="Automatic check failing: $WORKFLOW"
          issue=$(gh issue list --state open --label automation --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          case "$CONCLUSION" in
            success)
              if [ -n "$issue" ]; then
                gh issue close "$issue" --comment "Passing again: $URL ($BRANCH)."
              fi
              ;;
            failure|timed_out|startup_failure)
              if [ "$ATTEMPT" -lt 3 ]; then
                # Most failures here are a download or a runner that had a bad
                # moment; give it time before trying again.
                wait=$(( ATTEMPT * 600 ))
                echo "Attempt $ATTEMPT failed; running the failed jobs again in $wait s."
                sleep "$wait"
                gh run rerun "$RUN_ID" --failed
                exit 0
              fi
              jobs=$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- \(.name): \(.url)"')
              body=$(printf '%s failed %s times in a row on %s.\n\nRun: %s\n\nFailed jobs:\n%s\n\nThe next run that passes closes this issue.' "$WORKFLOW" "$ATTEMPT" "$BRANCH" "$URL" "$jobs")
              if [ -n "$issue" ]; then
                gh issue comment "$issue" --body "$body"
              else
                gh label create automation --color BFD4F2 --description 'Reported by the repository automation' 2>/dev/null || true
                gh issue create --title "$title" --label automation --body "$body"
              fi
              ;;
            *)
              echo "Run ended as $CONCLUSION; nothing to do."
              ;;
          esac
