name: Build

on:
  workflow_dispatch:
    inputs:
      libmpv:
        description: 'libmpv to ship: latest zhongfly build, or the one media_kit bundles'
        type: choice
        options: [latest, media_kit]
        default: latest
  push:
    branches: [main]
    tags: ['v*']
    # Pictures, text and the website alone need no new build (tags are
    # built whatever they change).
    paths-ignore: ['**.md', 'docs/**', 'website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**']

# A newer push to a pull request makes its earlier run moot.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release tag points at a commit main has normally built already, with the
  # same version and the same keys: its packages are signed and published
  # instead of building everything a second time.
  reuse:
    name: Reuse main's build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: Find main's finished build of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA&per_page=5" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0] // empty | "\(.id) \(.status) \(.conclusion)"'
          }
          # The build main started for this commit may still be running; wait
          # for it. A commit main never built (a version bump pushed by the
          # release workflow) is built here.
          deadline=$(( $(date +%s) + 90 * 60 ))
          seen=$(date +%s)
          while :; do
            read -r id status conclusion <<< "$(runs || true)"
            if [[ -z "${id:-}" ]]; then
              (( $(date +%s) - seen < 180 )) || { echo "main has no build of $GITHUB_SHA; building here."; exit 0; }
            elif [[ "$status" == completed ]]; then
              break
            fi
            (( $(date +%s) < deadline )) || { echo "main's build $id is still $status; building here."; exit 0; }
            sleep 60
          done
          if [[ "$conclusion" != success ]]; then
            echo "main's build $id ended $conclusion; building here."
            exit 0
          fi
          # Every package the release publishes: 3 Windows CPUs x 2, 2 AppImages, 2 DMGs, the APKs.
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name | select(test("^Lumtub-(windows|linux|macos|android)-"))] | length')
          if (( names != 11 )); then
            echo "main's build $id has $names of 11 packages; building here."
            exit 0
          fi
          echo "Reusing the packages of main's build $id."
          echo "run=$id" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.package_arch }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_arch: x64
            runner: windows-latest
            mpv_arch: x86_64
            runtime_arch: x86_64
            build_dir: x64
            install_arch: x64
          - package_arch: x64-v3
            runner: windows-latest
            mpv_arch: x86_64-v3
            runtime_arch: x86_64-v3
            build_dir: x64
            install_arch: x64
          - package_arch: arm64
            runner: windows-11-arm
            mpv_arch: aarch64
            runtime_arch: aarch64
            build_dir: arm64
            install_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      MPV_ARCH: ${{ matrix.mpv_arch }}
      RUNTIME_ARCH: ${{ matrix.runtime_arch }}
      BUILD_DIR: ${{ matrix.build_dir }}
      INSTALL_ARCH: ${{ matrix.install_arch }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's own commit, to read whether it asks for README pictures.
          fetch-depth: 2

      - name: Windows - verify latest zhongfly libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'Lumtub-GitHub-Actions'
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          # A new release is published before its assets finish uploading, so
          # take the newest one that already has this architecture's archive.
          $pattern = "^mpv-dev-$([regex]::Escape($env:MPV_ARCH))-.+\.7z$"
          $releases = Invoke-RestMethod -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri 'https://api.github.com/repos/zhongfly/mpv-winbuild/releases?per_page=5' -Headers $headers
          $release = $null
          $asset = $null
          foreach ($candidate in $releases) {
            if ($candidate.draft -or $candidate.prerelease) { continue }
            $asset = $candidate.assets | Where-Object { $_.name -match $pattern -and $_.state -eq 'uploaded' } | Select-Object -First 1
            if ($asset) { $release = $candidate; break }
          }
          if (-not $asset) { throw "No recent release has a $env:MPV_ARCH development archive." }
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') { throw "Latest libmpv asset has no SHA-256 digest: $($asset.name)" }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $downloadUri = [uri]$asset.browser_download_url
          if ($downloadUri.Scheme -ne 'https' -or $downloadUri.Host -ne 'github.com') { throw "Unexpected libmpv download host: $downloadUri" }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extractDir = Join-Path $env:RUNNER_TEMP 'lumtub-mpv-check'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri $downloadUri -OutFile $archive -Headers $headers
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "SHA-256 mismatch for $($asset.name)" }
          & tar.exe -xf $archive -C $extractDir 2>$null
          $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if (-not $library) {
            $sevenZip = Join-Path $env:RUNNER_TEMP '7zr.exe'
            Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip
            & $sevenZip x -y "-o$extractDir" $archive | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the latest libmpv archive.' }
            $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          }
          if (-not $library) { throw 'The latest libmpv archive does not contain libmpv-2.dll.' }
          if ($release.tag_name -notmatch '^[0-9A-Za-z._-]{1,100}$') { throw "Unexpected libmpv tag: $($release.tag_name)" }
          $release.tag_name | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'libmpv-tag.txt') -Encoding ascii -NoNewline
          Write-Host "Verified $($release.tag_name): $($asset.name), SHA-256, and $($library.FullName)"

      - name: Windows - read the Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_ENV"

      - name: Windows - install Flutter stable SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "flutter_windows_$env:FLUTTER_VERSION-stable.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $flutterBin = Join-Path $destination 'flutter/bin'
          if (-not (Test-Path -LiteralPath $flutterBin)) { throw 'Flutter SDK did not contain flutter/bin.' }
          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Windows ARM64 - select the native Flutter runtime
        if: matrix.package_arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item (Join-Path $env:RUNNER_TEMP 'flutter-sdk/flutter/bin/cache/engine-dart-sdk.stamp') -Force -ErrorAction SilentlyContinue
          & flutter --version
          $dartVersion = (& dart --version 2>&1 | Out-String)
          if ($dartVersion -notmatch 'windows_arm64') { throw "Expected the ARM64 Dart runtime, got: $dartVersion" }

      # media_kit publishes ANGLE only for x64. vcpkg builds it from source
      # for arm64 once; the result is cached by vcpkg commit.
      - name: Windows ARM64 - prepare vcpkg
        id: vcpkg
        if: matrix.package_arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path -LiteralPath (Join-Path $root 'vcpkg.exe'))) {
            $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone --depth 1 https://github.com/microsoft/vcpkg $root
            & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          }
          $commit = (git -C $root rev-parse HEAD).Trim()
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "vcpkg $commit at $root"

      - name: Windows ARM64 - restore ANGLE
        id: angle-cache
        if: matrix.package_arch == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/angle-arm64
          key: angle-arm64-windows-${{ steps.vcpkg.outputs.commit }}

      - name: Windows ARM64 - build ANGLE
        if: matrix.package_arch == 'arm64' && steps.angle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path '${{ steps.vcpkg.outputs.root }}' 'vcpkg.exe'
          & $vcpkg install angle:arm64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg could not build ANGLE for arm64.' }
          $installed = Join-Path '${{ steps.vcpkg.outputs.root }}' 'installed/arm64-windows'
          $out = Join-Path $env:RUNNER_TEMP 'angle-arm64'
          New-Item -ItemType Directory -Force -Path (Join-Path $out 'lib') | Out-Null
          Copy-Item (Join-Path $installed 'bin/*.dll') $out
          foreach ($name in 'libEGL', 'libGLESv2') {
            $lib = Get-ChildItem -LiteralPath (Join-Path $installed 'lib') -Filter "$name*.lib" -File | Select-Object -First 1
            if (-not $lib) { throw "vcpkg produced no $name import library." }
            Copy-Item -LiteralPath $lib.FullName (Join-Path $out "lib/$name.dll.lib")
          }
          Get-ChildItem -Recurse $out | ForEach-Object { Write-Host $_.FullName }

      # The x64 media_kit archives cannot link on arm64; put the aarch64
      # libmpv and arm64 ANGLE where media_kit_libs_windows_video expects
      # them (see vendor/media_kit_libs_windows_video/windows/CMakeLists.txt).
      - name: Windows ARM64 - stage libmpv and ANGLE
        if: matrix.package_arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $build = "build/windows/$env:BUILD_DIR"
          $mpv = Join-Path $build 'libmpv'
          $angle = Join-Path $build 'ANGLE'
          New-Item -ItemType Directory -Force -Path (Join-Path $mpv 'include'), (Join-Path $angle 'lib') | Out-Null

          $extractDir = Join-Path $env:RUNNER_TEMP 'lumtub-mpv-check'
          foreach ($name in 'libmpv-2.dll', 'libmpv.dll.a') {
            $file = Get-ChildItem -LiteralPath $extractDir -Filter $name -File -Recurse | Select-Object -First 1
            if (-not $file) { throw "The aarch64 libmpv archive has no $name." }
            Copy-Item -LiteralPath $file.FullName $mpv
          }
          $client = Get-ChildItem -LiteralPath $extractDir -Filter 'client.h' -File -Recurse | Select-Object -First 1
          if (-not $client) { throw 'The aarch64 libmpv archive has no headers.' }
          Copy-Item (Join-Path $client.DirectoryName '*.h') (Join-Path $mpv 'include')

          # Headers from the archive media_kit uses on x64 (same MD5 check).
          $archive = Join-Path $env:RUNNER_TEMP 'ANGLE.7z'
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri 'https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE.7z' -OutFile $archive
          $md5 = (Get-FileHash -LiteralPath $archive -Algorithm MD5).Hash.ToLowerInvariant()
          if ($md5 -ne 'e866f13e8d552348058afaafe869b1ed') { throw 'ANGLE header archive failed its MD5 check.' }
          $headers = Join-Path $env:RUNNER_TEMP 'angle-headers'
          New-Item -ItemType Directory -Force -Path $headers | Out-Null
          & cmake -E chdir $headers cmake -E tar xf $archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the ANGLE headers.' }
          Copy-Item -Recurse (Join-Path $headers 'include') $angle

          $built = Join-Path $env:RUNNER_TEMP 'angle-arm64'
          Copy-Item (Join-Path $built '*.dll') $angle
          Copy-Item (Join-Path $built 'lib/*.lib') (Join-Path $angle 'lib')
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist\D3D\arm64\d3dcompiler_47.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdk) { throw 'The Windows SDK has no arm64 d3dcompiler_47.dll.' }
          Copy-Item -LiteralPath $sdk.FullName $angle
          Get-ChildItem -Recurse $build -Include *.dll, *.lib, *.a, client.h, egl.h | ForEach-Object { Write-Host $_.FullName }

      - name: Windows - get packages
        run: flutter pub get

      - name: Windows - analyze sources
        run: flutter analyze

      - name: Windows - install the Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $hostTriple = if ($env:PACKAGE_ARCH -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri "https://static.rust-lang.org/rustup/dist/$hostTriple/rustup-init.exe" -OutFile $init
            & $init -y --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed.' }
            $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
            $env:PATH = "$cargoBin;$env:PATH"
            $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          $target = if ($env:PACKAGE_ARCH -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          # The runner image may carry an older Rust; build with the newest stable.
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          rustup target add $target

      # Keyed by the toolchain installed above, so a new stable starts a fresh cache.
      - name: Windows - cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/lumtub_core
          key: ${{ matrix.package_arch }}

      # ring, which rustls uses for the Mozilla and Google certificate lists,
      # is built with clang on Windows on Arm.
      - name: Windows - find clang
        if: matrix.package_arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvm = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path (Join-Path $llvm 'clang.exe'))) {
              choco install llvm -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'Installing LLVM failed.' }
            }
            $env:PATH = "$llvm;$env:PATH"
            $llvm | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          clang --version

      - name: Windows - build the Rust core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = if ($env:PACKAGE_ARCH -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          # Each package is built for its own CPU level, as libmpv is.
          if ($env:PACKAGE_ARCH -eq 'x64-v3') { $env:RUSTFLAGS = '-C target-cpu=x86-64-v3' }
          $manifest = 'native/lumtub_core/Cargo.toml'
          cargo test --manifest-path $manifest --release --target $target
          if ($LASTEXITCODE -ne 0) { throw 'Rust core tests failed.' }
          cargo build --manifest-path $manifest --release --target $target --lib
          if ($LASTEXITCODE -ne 0) { throw 'Rust core build failed.' }
          $dll = (Resolve-Path "native/lumtub_core/target/$target/release/lumtub_core.dll").Path
          Write-Host "lumtub_core.dll: $((Get-Item $dll).Length) bytes"
          # The Dart tests load it from here; packaging copies it next to lumtub.exe.
          "LUMTUB_CORE_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows - run unit tests
        run: flutter test

      - name: Windows - determine package version
        shell: bash
        run: |
          base=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$base-${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "LUMTUB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - name: Windows - build release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.YTPLUS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.YTPLUS_GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: flutter build windows --release --dart-define=LUMTUB_VERSION="$LUMTUB_VERSION" --dart-define=LUMTUB_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=LUMTUB_GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" --dart-define=LUMTUB_PACKAGE="windows-$PACKAGE_ARCH" --dart-define=LUMTUB_BUILT="$(git log -1 --format=%cI)"

      - name: Windows - check delayed video plugin loading
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -LiteralPath $install -Filter dumpbin.exe -File -Recurse | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found.' }
          $releaseDir = Join-Path "build/windows/$env:BUILD_DIR/runner" 'Release'
          $imports = & $dumpbin.FullName /imports (Join-Path $releaseDir 'lumtub.exe') | Out-String
          $delayed = $imports.IndexOf('Section contains the following delay load imports')
          if ($delayed -lt 0 -or $imports.IndexOf('media_kit_video_plugin.dll', $delayed) -lt 0) { throw 'media_kit_video_plugin.dll is not delay-loaded.' }
          Write-Host 'media_kit_video_plugin.dll is delay-loaded.'

      - name: Windows - replace bundled libmpv DLL
        if: github.event_name != 'workflow_dispatch' || inputs.libmpv == 'latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $env:RUNNER_TEMP 'lumtub-mpv-check'
          $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse | Select-Object -First 1
          if (-not $library) { throw 'Verified libmpv-2.dll is missing.' }
          $releaseDir = Join-Path "build/windows/$env:BUILD_DIR/runner" 'Release'
          $destination = Join-Path $releaseDir 'libmpv-2.dll'
          if (-not (Test-Path -LiteralPath $destination)) { throw 'The release build does not contain media_kit libmpv-2.dll to replace.' }
          Copy-Item -LiteralPath $library.FullName -Destination $destination -Force
          $sourceHash = (Get-FileHash -LiteralPath $library.FullName -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          if ($sourceHash -ne $targetHash) { throw 'The bundled libmpv replacement did not verify.' }
          $tag = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'libmpv-tag.txt')
          "$tag`n$env:RUNTIME_ARCH`n" | Out-File -FilePath (Join-Path $releaseDir 'libmpv-version.txt') -Encoding ascii -NoNewline
          Write-Host "Replaced the bundled DLL with $($library.FullName)"

      # A fresh Windows has no Visual C++ runtime, and lumtub.exe, the Flutter
      # engine and the Rust core need it. Microsoft allows shipping the
      # redistributable DLLs next to the program; they come from the Visual
      # Studio that built the app, so they are never older than it needs.
      - name: Windows - bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw 'Visual Studio not found.' }
          $arch = if ($env:BUILD_DIR -eq 'arm64') { 'arm64' } else { 'x64' }
          $redist = Join-Path $install 'VC\Redist\MSVC'
          $crt = Get-ChildItem -LiteralPath $redist -Directory | Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Get-ChildItem -LiteralPath (Join-Path $_.FullName $arch) -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crt) { throw "No $arch Visual C++ runtime under $redist." }
          Write-Host "Visual C++ runtime from $($crt.FullName)"
          $releaseDir = Join-Path "build/windows/$env:BUILD_DIR/runner" 'Release'
          Copy-Item -Path (Join-Path $crt.FullName '*.dll') -Destination $releaseDir -Force
          Get-ChildItem -LiteralPath $releaseDir -Filter '*.dll' | Where-Object { $_.Name -match '^(msvcp|vcruntime|concrt)' } | ForEach-Object { Write-Host "$($_.Name) $($_.VersionInfo.FileVersion)" }

      - name: Windows - package portable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep the platform in every distributable name. Future platform
          # jobs use the same Lumtub_<version>_<platform>-<architecture> form.
          $package = "Lumtub_$env:LUMTUB_VERSION`_windows-$env:PACKAGE_ARCH"
          $releaseDir = Join-Path "build/windows/$env:BUILD_DIR/runner" 'Release'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath $env:LUMTUB_CORE_DLL -Destination $releaseDir -Force
          Copy-Item -Recurse -Force "$releaseDir/*" $package
          Copy-Item LICENSE, NOTICE $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
          # Only the ZIP carries the marker: the installer is built from the
          # same folder and keeps its data in LocalAppData.
          $marker = Join-Path $env:RUNNER_TEMP 'portable.txt'
          "Lumtub keeps its settings, cache and logs in the userdata folder next to this file.`r`nDelete this file to keep them in %LOCALAPPDATA%\Lumtub instead.`r`n" | Out-File -FilePath $marker -Encoding ascii -NoNewline
          Compress-Archive -Update -Path $marker -DestinationPath "$package.zip"

      - name: Windows - check the Visual C++ runtime is bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path "Lumtub_$env:LUMTUB_VERSION`_windows-$env:PACKAGE_ARCH").Path
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $package $name))) { throw "$name is missing from the package." }
          }
          # Whatever runtime DLL any bundled program imports must be bundled too.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -LiteralPath $install -Filter dumpbin.exe -File -Recurse | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found.' }
          $missing = @()
          foreach ($file in Get-ChildItem -LiteralPath $package -Recurse -Include *.dll, *.exe) {
            $dependents = & $dumpbin.FullName /dependents $file.FullName | Out-String
            foreach ($m in [regex]::Matches($dependents, '(?im)^\s+((?:msvcp|vcruntime|concrt|vccorlib|vcomp)\d+\w*\.dll)\s*$')) {
              $name = $m.Groups[1].Value
              if (-not (Test-Path -LiteralPath (Join-Path $package $name))) { $missing += "$($file.Name) needs $name" }
            }
          }
          if ($missing) { throw ('Not bundled: ' + (($missing | Sort-Object -Unique) -join '; ')) }
          Write-Host 'The Visual C++ runtime is bundled.'

      - name: Windows - build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path -LiteralPath $default)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = Get-Item -LiteralPath $default
          }
          $source = (Resolve-Path "Lumtub_$env:LUMTUB_VERSION`_windows-$env:PACKAGE_ARCH").Path
          $output = Join-Path (Get-Location) 'installer'
          & $iscc.Source "/DAppVersion=$env:LUMTUB_VERSION" "/DSourceDir=$source" "/DOutputDir=$output" "/DPackageArch=$env:PACKAGE_ARCH" "/DInstallArch=$env:INSTALL_ARCH" 'windows/installer/lumtub.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }

      - name: Windows - README pictures
        if: matrix.package_arch == 'x64' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        run: |
          $message = git log -1 --format=%B HEAD^2 2> $null
          if ($LASTEXITCODE -ne 0) { $message = git log -1 --format=%B HEAD }
          if (-not (($message -join "`n").Contains('[showcase]'))) { exit 0 }
          Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue
          $package = "Lumtub_$env:LUMTUB_VERSION`_windows-$env:PACKAGE_ARCH"
          windows/packaging/showcase.ps1 (Resolve-Path "$package/lumtub.exe").Path "$env:RUNNER_TEMP/shots"

      - name: Windows - upload README pictures
        if: matrix.package_arch == 'x64' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: readme-shots-windows
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Windows - upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lumtub-windows-${{ matrix.package_arch }}-portable
          path: Lumtub_*_windows-${{ matrix.package_arch }}.zip
          if-no-files-found: error

      - name: Windows - upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lumtub-windows-${{ matrix.package_arch }}-installer
          path: installer/Lumtub_*_windows-${{ matrix.package_arch }}-setup.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.package_arch }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_arch: x64
            runner: ubuntu-24.04
            appimage_arch: x86_64
          - package_arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    # Pinned, so a new default Ubuntu changes nothing; the build itself runs
    # in Ubuntu 22.04, whose glibc 2.35 sets the oldest Linux the AppImage
    # runs on: the oldest Ubuntu LTS in standard support, as AppImageHub
    # tests on.
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      DEBIAN_FRONTEND: noninteractive
    permissions:
      contents: read
    steps:
      - name: Linux - install build tools
        run: |
          # Ubuntu's archive is sometimes unreachable from the runners: retry,
          # then switch to the Azure mirror the hosted runners use.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80retries
          cat > /usr/local/bin/apt-install <<'SH'
          #!/bin/sh
          for attempt in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends "$@" && exit 0
            if [ "$attempt" = 2 ] && grep -q 'archive.ubuntu.com' /etc/apt/sources.list; then
              sed -i 's#http://\(archive\|security\).ubuntu.com#http://azure.archive.ubuntu.com#' /etc/apt/sources.list
            fi
            sleep 10
          done
          exit 1
          SH
          chmod +x /usr/local/bin/apt-install
          apt-install ca-certificates curl git unzip xz-utils zip file patchelf binutils \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfontconfig-dev libssl-dev desktop-file-utils python3 \
            libepoxy-dev libasound2 libpulse0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's own commit, to read whether it asks for README pictures.
          fetch-depth: 2

      - name: Linux - read the Flutter version and the pinned downloads
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_ENV"
          grep -E '^[A-Z0-9_]+=' .github/pins.env >> "$GITHUB_ENV"

      - name: Linux - install Flutter stable SDK
        run: |
          git config --global --add safe.directory '*'
          if [ "$PACKAGE_ARCH" = x64 ]; then
            archive="$RUNNER_TEMP/flutter.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            tar -xJf "$archive" -C "$RUNNER_TEMP"
          else
            # Flutter publishes no arm64 Linux SDK archive; the same release
            # from git fetches its arm64 Dart SDK and engine on first run.
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Linux - install the Rust toolchain
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt,clippy --default-toolchain stable --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version

      - name: Linux - cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/lumtub_core
          key: linux-${{ matrix.package_arch }}

      - name: Linux - build the Rust core
        run: |
          manifest=native/lumtub_core/Cargo.toml
          if [ "${{ matrix.package_arch }}" = x64 ]; then
            cargo fmt --manifest-path "$manifest" --check
            cargo clippy --manifest-path "$manifest" --release --all-targets -- -D warnings
          fi
          cargo test --manifest-path "$manifest" --release
          cargo build --manifest-path "$manifest" --release --lib
          core="$PWD/native/lumtub_core/target/release/liblumtub_core.so"
          echo "liblumtub_core.so: $(stat -c %s "$core") bytes"
          echo "LUMTUB_CORE_DLL=$core" >> "$GITHUB_ENV"

      # Real servers: Cloudflare must agree on X25519MLKEM768 in every
      # certificate mode; what YouTube's hosts agree on is printed.
      - name: Linux - post-quantum TLS against real servers
        if: matrix.package_arch == 'x64'
        run: cargo test --manifest-path native/lumtub_core/Cargo.toml --release --lib tls::tests::live -- --ignored --nocapture --test-threads 1

      # GitHub's release downloads time out now and then; keep them between runs.
      - name: Linux - cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .linux-downloads
          key: linux-downloads-${{ matrix.package_arch }}-${{ env.MPV_RELEASE }}-v1

      - name: Linux - download libmpv
        run: |
          case "$PACKAGE_ARCH" in
            x64) arch=x86_64; sum=$MPV_SHA256_X86_64 ;;
            arm64) arch=arm64; sum=$MPV_SHA256_ARM64 ;;
          esac
          name="libmpv-$MPV_VERSION-linux-$arch-gpl-$MPV_RELEASE"
          mkdir -p .linux-downloads
          archive="$PWD/.linux-downloads/$name.tar.gz"
          [ -s "$archive" ] || curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors -o "$archive" "https://github.com/jason-yau/mpv-prebuilt/releases/download/$MPV_RELEASE/$name.tar.gz"
          echo "$sum  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$name" "$RUNNER_TEMP/mpv"
          cat "$RUNNER_TEMP/mpv/manifest.txt"
          # FFmpeg, libplacebo and the rest are inside libmpv; the private
          # requirements only matter for static linking and are not installed.
          sed -i '/^Requires.private:/d' "$RUNNER_TEMP/mpv/lib/pkgconfig/mpv.pc"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/mpv/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$RUNNER_TEMP/mpv/lib/pkgconfig" pkg-config --modversion --libs mpv

      - name: Linux - get packages
        run: flutter pub get

      - name: Linux - run unit tests
        run: flutter test

      - name: Linux - determine package version
        run: |
          base=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$base-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "$version" | grep -Eq '^[0-9A-Za-z.+-]+$' || { echo "Unexpected version: $version"; exit 1; }
          echo "LUMTUB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - name: Linux - build release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.YTPLUS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.YTPLUS_GOOGLE_CLIENT_SECRET }}
        run: flutter build linux --release --dart-define=LUMTUB_VERSION="$LUMTUB_VERSION" --dart-define=LUMTUB_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=LUMTUB_GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" --dart-define=LUMTUB_PACKAGE="linux-$PACKAGE_ARCH" --dart-define=LUMTUB_BUILT="$(git log -1 --format=%cI)"

      - name: Linux - package AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          bundle="build/linux/$PACKAGE_ARCH/release/bundle"
          # Only here, so the smoke test finds nothing but what the AppImage carries.
          LD_LIBRARY_PATH="$RUNNER_TEMP/mpv/lib" linux/packaging/make-appdir.sh "$bundle" "$LUMTUB_CORE_DLL" "$RUNNER_TEMP/AppDir"
          cp LICENSE NOTICE "$RUNNER_TEMP/AppDir/usr/bin/"
          mkdir -p "$RUNNER_TEMP/AppDir/usr/share/doc/libmpv"
          cp -r "$RUNNER_TEMP/mpv/licenses" "$RUNNER_TEMP/mpv/manifest.txt" "$RUNNER_TEMP/AppDir/usr/share/doc/libmpv/"
          # Nothing bundled may need a newer glibc than the build system's.
          newest=$(find "$RUNNER_TEMP/AppDir" -type f -exec sh -c 'file -b "$1" | grep -q ^ELF && objdump -T "$1"' _ {} \; 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest glibc symbol needed: $newest"
          if [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -1)" != GLIBC_2.35 ]; then
            echo "The AppDir needs $newest, newer than Ubuntu 22.04's glibc 2.35." >&2
            exit 1
          fi
          case "$APPIMAGE_ARCH" in
            x86_64) APPIMAGETOOL_SHA256=$APPIMAGETOOL_SHA256_X86_64 ;;
            aarch64) APPIMAGETOOL_SHA256=$APPIMAGETOOL_SHA256_AARCH64 ;;
          esac
          tool="$PWD/.linux-downloads/appimagetool-$APPIMAGETOOL_VERSION-$APPIMAGE_ARCH"
          [ -s "$tool" ] || curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors -o "$tool" "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$APPIMAGE_ARCH.AppImage"
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum -c -
          chmod +x "$tool"
          # No FUSE in the container: the tool unpacks itself and runs.
          # The runtime appimagetool would fetch itself, with retries.
          runtime="$PWD/.linux-downloads/runtime-$APPIMAGE_ARCH"
          [ -s "$runtime" ] || curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors -o "$runtime" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$APPIMAGE_ARCH"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="$APPIMAGE_ARCH" "$tool" --runtime-file "$runtime" --no-appstream "$RUNNER_TEMP/AppDir" "Lumtub_${LUMTUB_VERSION}_linux-$PACKAGE_ARCH.AppImage"
          ls -l Lumtub_*.AppImage

      - name: Linux - smoke test the AppImage
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          apt-install xvfb xauth libgl1-mesa-dri libegl1 libgles2 ffmpeg imagemagick gdb
          linux/packaging/smoke.sh Lumtub_*_linux-$PACKAGE_ARCH.AppImage "$RUNNER_TEMP/smoke"

      - name: Linux - README pictures
        if: matrix.package_arch == 'x64' && !startsWith(github.ref, 'refs/tags/')
        run: |
          message=$(git log -1 --format=%B HEAD^2 2> /dev/null || git log -1 --format=%B HEAD)
          if echo "$message" | grep -qF '[showcase]'; then
            apt-install xdotool fonts-noto-core fonts-noto-cjk bc
            linux/packaging/showcase.sh Lumtub_*_linux-x64.AppImage "$RUNNER_TEMP/shots"
          fi

      - name: Linux - upload README pictures
        if: matrix.package_arch == 'x64' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: readme-shots-linux
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Linux - upload smoke test results
        if: always() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-linux-${{ matrix.package_arch }}
          path: |
            ${{ runner.temp }}/smoke
            !${{ runner.temp }}/smoke/test.mp4
          if-no-files-found: ignore

      - name: Linux - upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lumtub-linux-${{ matrix.package_arch }}-appimage
          path: Lumtub_*_linux-${{ matrix.package_arch }}.AppImage
          if-no-files-found: error

  showcase:
    name: README pictures
    # Runs only for a commit whose message contains [showcase]: pushes the
    # pictures the Windows x64, Linux x64 and macOS jobs took of the app's
    # pages to the readme-shots branch, one folder per system.
    needs: [windows, linux, macos]
    # Never for a release tag: its squashed message carries the pull request's [showcase].
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check whether pictures are wanted
        id: wanted
        run: |
          if git log -1 --format=%B | grep -qF '[showcase]'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.wanted.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: readme-shots-*
          path: ${{ runner.temp }}/shots
      - name: Cache the narration voice
        if: steps.wanted.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kokoro
          key: kokoro-v1.0
      - name: Make the promo videos
        if: steps.wanted.outputs.run == 'true'
        continue-on-error: true
        run: |
          # Kokoro (Apache-2.0) reads the narration; the files are checked
          # against the hashes they had when this was written.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fontconfig
          voice="$RUNNER_TEMP/kokoro"
          mkdir -p "$voice"
          for file in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "$voice/$file" ] || curl -fsSL --retry 5 --retry-all-errors -o "$voice/$file" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$file"
          done
          (cd "$voice" && sha256sum -c) <<'SUMS'
          7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin
          SUMS
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q kokoro-onnx==0.6.1 'misaki[zh]==0.7.4' scipy==1.18.1 pillow==13.0.0
          "$RUNNER_TEMP/venv/bin/python" linux/packaging/promo.py "$RUNNER_TEMP/shots/readme-shots-linux" "$voice/kokoro-v1.0.onnx" "$voice/voices-v1.0.bin"
      - name: Push the pictures
        if: steps.wanted.outputs.run == 'true'
        run: |
          sha=$(git rev-parse --short HEAD)
          git checkout --orphan readme-shots
          git rm -rfq .
          git clean -fdxq
          for system in windows linux macos; do
            from="$RUNNER_TEMP/shots/readme-shots-$system"
            [ -d "$from" ] || continue
            mkdir -p "$system"
            cp "$from"/*.png "$from"/*.log "$from"/stdout.txt "$from"/promo-*.mp4 "$from"/tour.gif "$system/" 2> /dev/null || true
          done
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Pictures of $sha"
          git push -f origin readme-shots

  macos:
    name: macOS
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run == '' }}
    # Pinned like the others; Apple silicon, building once for both CPUs and
    # packing a DMG thinned to each.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's own commit, to read whether it asks for README pictures.
          fetch-depth: 2

      - name: macOS - read the Flutter version and the pinned downloads
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_ENV"
          grep -E '^[A-Z0-9_]+=' .github/pins.env >> "$GITHUB_ENV"

      - name: macOS - install Flutter stable SDK
        run: |
          archive="$RUNNER_TEMP/flutter.zip"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_$FLUTTER_VERSION-stable.zip"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: macOS - install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - name: macOS - cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/lumtub_core
          key: macos-universal

      - name: macOS - build the Rust core
        run: |
          manifest=native/lumtub_core/Cargo.toml
          cargo test --manifest-path "$manifest" --release
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            MACOSX_DEPLOYMENT_TARGET=12.0 cargo build --manifest-path "$manifest" --release --lib --target "$target"
          done
          core="$RUNNER_TEMP/liblumtub_core.dylib"
          lipo -create -output "$core" native/lumtub_core/target/{aarch64,x86_64}-apple-darwin/release/liblumtub_core.dylib
          install_name_tool -id @rpath/liblumtub_core.dylib "$core"
          lipo -info "$core"
          echo "LUMTUB_CORE_DLL=$core" >> "$GITHUB_ENV"

      - name: macOS - get packages
        run: flutter pub get

      - name: macOS - run unit tests
        run: flutter test

      - name: macOS - determine package version
        run: |
          base=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$base-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "$version" | grep -Eq '^[0-9A-Za-z.+-]+$' || { echo "Unexpected version: $version"; exit 1; }
          echo "LUMTUB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - name: macOS - build release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.YTPLUS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.YTPLUS_GOOGLE_CLIENT_SECRET }}
        run: flutter build macos --release --dart-define=LUMTUB_VERSION="$LUMTUB_VERSION" --dart-define=LUMTUB_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=LUMTUB_GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" --dart-define=LUMTUB_PACKAGE=macos --dart-define=LUMTUB_BUILT="$(git log -1 --format=%cI)"

      - name: macOS - download ffmpeg for the smoke test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          name="ffmpeg-${FFMPEG_RELEASE#v}-lgpl-macos-arm64"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/$name.tar.xz" "https://github.com/dfloresc/ffmpeg-macos-builds/releases/download/$FFMPEG_RELEASE/$name.tar.xz"
          echo "$FFMPEG_ARM64_SHA256  $RUNNER_TEMP/$name.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "FFMPEG=$RUNNER_TEMP/$name/bin/ffmpeg" >> "$GITHUB_ENV"

      - name: macOS - import the signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Only once a Developer ID certificate is in the repository's
          # secrets; until then the app is signed ad hoc.
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "No Developer ID certificate; signing ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "The certificate is not a Developer ID Application one."; exit 1; }
          echo "APPLE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: macOS - package DMGs
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app=build/macos/Build/Products/Release/Lumtub.app
          macos/packaging/package.sh "$app" "$LUMTUB_CORE_DLL" "Lumtub_${LUMTUB_VERSION}_macos-arm64.dmg" arm64
          macos/packaging/package.sh "$app" "$LUMTUB_CORE_DLL" "Lumtub_${LUMTUB_VERSION}_macos-x64.dmg" x86_64

      - name: macOS - smoke test the Apple silicon DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: macos/packaging/smoke.sh Lumtub_*_macos-arm64.dmg "$RUNNER_TEMP/smoke"

      - name: macOS - smoke test the Intel DMG under Rosetta
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
          macos/packaging/smoke.sh Lumtub_*_macos-x64.dmg "$RUNNER_TEMP/smoke-intel"

      - name: macOS - README pictures
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          message=$(git log -1 --format=%B HEAD^2 2> /dev/null || git log -1 --format=%B HEAD)
          if echo "$message" | grep -qF '[showcase]'; then
            macos/packaging/showcase.sh Lumtub_*_macos-arm64.dmg "$RUNNER_TEMP/shots"
          fi

      - name: macOS - upload README pictures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: readme-shots-macos
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: macOS - upload smoke test results
        if: always() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-macos
          path: |
            ${{ runner.temp }}/smoke
            ${{ runner.temp }}/smoke-intel
            !${{ runner.temp }}/smoke/test.mp4
            !${{ runner.temp }}/smoke-intel/test.mp4
          if-no-files-found: ignore

      - name: macOS - upload Apple silicon DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lumtub-macos-arm64-dmg
          path: Lumtub_*_macos-arm64.dmg
          if-no-files-found: error

      - name: macOS - upload Intel DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lumtub-macos-x64-dmg
          path: Lumtub_*_macos-x64.dmg
          if-no-files-found: error

  android:
    name: Android
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Android - read the Flutter version
        shell: bash
        run: echo "FLUTTER_VERSION=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_ENV"

      - name: Android - install Flutter stable SDK
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Android - SDK, NDK and Java
        run: |
          # The runner image carries the SDK; r28 or newer for 16 KB pages.
          ndk="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Android - install the Rust toolchain
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Android - cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/lumtub_core
          key: android

      - name: Android - build the Rust core
        run: android/packaging/build-core.sh

      - name: Android - get packages
        run: flutter pub get

      - name: Android - determine package version
        run: |
          base=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$base-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "$version" | grep -Eq '^[0-9A-Za-z.+-]+$' || { echo "Unexpected version: $version"; exit 1; }
          echo "LUMTUB_VERSION=$version" >> "$GITHUB_ENV"

      - name: Android - release key
        env:
          KEYSTORE: ${{ secrets.LUMTUB_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMTUB_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the secrets the debug key signs (pull requests from forks).
          if [ -z "$KEYSTORE" ]; then echo "::warning::No release key: the APKs are signed with a debug key"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=lumtub\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - name: Android - build APKs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.YTPLUS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.YTPLUS_GOOGLE_CLIENT_SECRET }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMTUB_ANDROID_KEYSTORE_PASSWORD }}
          HYBRID_CLASSICAL_KEY: ${{ secrets.LUMTUB_ANDROID_HYBRID_CLASSICAL_KEY }}
          HYBRID_CLASSICAL_CERT: ${{ secrets.LUMTUB_ANDROID_HYBRID_CLASSICAL_CERT }}
          HYBRID_PQC_KEY: ${{ secrets.LUMTUB_ANDROID_HYBRID_PQC_KEY }}
          HYBRID_PQC_CERT: ${{ secrets.LUMTUB_ANDROID_HYBRID_PQC_CERT }}
        run: |
          flutter build apk --release --split-per-abi --dart-define=LUMTUB_VERSION="$LUMTUB_VERSION" --dart-define=LUMTUB_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=LUMTUB_GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" --dart-define=LUMTUB_PACKAGE=android --dart-define=LUMTUB_BUILT="$(git log -1 --format=%cI)"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/Lumtub_${LUMTUB_VERSION}_android-$abi.apk"
          done
          # APK Signature Scheme v3.2 (classical EC + ML-DSA-65, checked from
          # Android 17 on) needs apksigner 37 on a JDK that knows ML-DSA.
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses > /dev/null || true
          "$sdk/sdkmanager" --channel=3 "build-tools;37.0.0-rc2" > /dev/null
          tools="$ANDROID_HOME/build-tools/37.0.0-rc2"
          if [ -f android/release.jks ] && [ -n "$HYBRID_PQC_KEY" ]; then
            keys="$RUNNER_TEMP/hybrid"; mkdir -p "$keys"
            echo "$HYBRID_CLASSICAL_KEY" | base64 -d > "$keys/hybrid-classical.pk8"
            echo "$HYBRID_CLASSICAL_CERT" | base64 -d > "$keys/hybrid-classical.x509.der"
            echo "$HYBRID_PQC_KEY" | base64 -d > "$keys/hybrid-pqc.pk8"
            echo "$HYBRID_PQC_CERT" | base64 -d > "$keys/hybrid-pqc.x509.der"
            for apk in dist/*.apk; do
              echo "== $(basename "$apk")"
              JAVA_HOME="$JAVA_HOME_25_X64" PATH="$JAVA_HOME_25_X64/bin:$PATH" android/packaging/sign-hybrid.sh \
                "$tools/apksigner" "$apk" "$apk.signed" android/release.jks "$keys"
              mv "$apk.signed" "$apk"
            done
            rm -rf "$keys"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::A release needs the release keystore and the hybrid (ML-DSA) keys"
            exit 1
          else
            echo "::warning::No hybrid (ML-DSA) keys: the APKs carry no v3.2 signature"
          fi
          for apk in dist/*.apk; do
            echo "$(basename "$apk"): $(stat -c %s "$apk") bytes"
            # 16 KB page alignment of the uncompressed native libraries.
            "$tools/zipalign" -c -P 16 -v 4 "$apk" | grep -E '\.so|Verification' | tail -12
          done
          rm -f android/release.jks android/key.properties

      - name: Android - start an emulator
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          # A download cut short leaves a broken archive; ask again.
          for try in 1 2 3; do
            "$sdk/sdkmanager" "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null && break
            [ "$try" = 3 ] && exit 1
            sleep 20
          done
          # Written by hand: this avdmanager cannot read the SDK's newer XML and makes nothing.
          avd="$HOME/.android/avd"; mkdir -p "$avd/smoke.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/smoke.avd\ntarget=android-34\n' "$avd" > "$avd/smoke.ini"
          cat > "$avd/smoke.avd/config.ini" <<'INI'
          AvdId=smoke
          abi.type=x86_64
          hw.cpu.arch=x86_64
          image.sysdir.1=system-images/android-34/google_apis/x86_64/
          tag.id=google_apis
          hw.lcd.width=1080
          hw.lcd.height=2400
          hw.lcd.density=420
          hw.ramSize=4096
          disk.dataPartition.size=6G
          hw.keyboard=yes
          hw.dPad=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          INI
          sed -i 's/^ *//' "$avd/smoke.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          sleep 20; tail -20 "$RUNNER_TEMP/emulator.log"

      - name: Android - smoke test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 600 android/packaging/smoke.sh dist/Lumtub_*_android-x86_64.apk "$RUNNER_TEMP/smoke" || { echo "--- emulator log"; tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; }

      - name: Android - upload smoke test
        if: always() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - name: Android - upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lumtub-android-apk
          path: dist/*.apk

      - name: Android - pictures to the android-shots branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          sha=$(git rev-parse --short HEAD)
          git checkout -q --orphan android-shots
          git rm -rfq . && git clean -fdxq
          cp "$RUNNER_TEMP"/smoke/*.png "$RUNNER_TEMP"/smoke/*.mp4 . 2> /dev/null || true
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Android pictures of $sha"
          git push -f origin android-shots

  release:
    name: Release
    needs: [reuse, windows, linux, macos, android]
    # Skipped builds (reused from main) are not failures.
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            release-notes
            native/lumtub_core
      - name: Packages built here
        if: needs.reuse.outputs.run == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: Lumtub-{windows,linux,macos,android}-*
          merge-multiple: true
      - name: Packages main built
        if: needs.reuse.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: Lumtub-{windows,linux,macos,android}-*
          merge-multiple: true
          run-id: ${{ needs.reuse.outputs.run }}
          github-token: ${{ github.token }}
      - name: Check the packages carry this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # main names its packages <pubspec version>-<commit>, as the tag does.
          shopt -s nullglob
          files=(dist/*)
          (( ${#files[@]} > 0 )) || { echo "::error::No packages"; exit 1; }
          for f in "${files[@]}"; do
            [[ "$(basename "$f")" == *"${TAG#v}"* ]] || { echo "::error::$f does not carry ${TAG#v}"; exit 1; }
          done
          ls -l dist
      - name: Sign all packages
        env:
          LUMTUB_UPDATE_KEY: ${{ secrets.LUMTUB_UPDATE_KEY }}
        run: |
          # Each installer, ZIP, AppImage and DMG gets a .sig (Ed25519 + ML-DSA-65); Lumtub
          # installs an update only when both signatures hold.
          if [[ -z "$LUMTUB_UPDATE_KEY" ]]; then
            echo "::error::The LUMTUB_UPDATE_KEY secret is not set; the release would not update itself."
            exit 1
          fi
          rustup update stable
          shopt -s nullglob
          cargo run --quiet --manifest-path native/lumtub_core/Cargo.toml --bin lumtub-sign -- dist/*-setup.exe dist/*.zip dist/*.AppImage dist/*.dmg dist/*.apk
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Written notes for the version (v0.2.0-abc1234 reads
          # release-notes/0.2.0.md), else notes generated from the commits.
          version="${TAG#v}"
          version="${version%%-*}"
          notes="release-notes/$version.md"
          if [[ -f "$notes" ]]; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Lumtub $version" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Lumtub $TAG" --generate-notes
          fi
