name: Checks

# The quick checks every pull request gets: analysis, formatting, clippy, and
# the Rust and Dart tests on Linux and Windows x64. They don't wait for other
# runs, so pull requests are checked side by side. The full build of every
# package (Build) runs on main after the merge, and on a pull request only
# when asked for (see build.yml). On main, these runs also keep the caches
# that pull requests start from.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**']
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Tests only: the packages keep fat LTO with one codegen unit
  # (Cargo.toml); here the core compiles in a fraction of the time.
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The rules these check are in docs/SECURE-CODING.md.
      - name: Workflows (zizmor)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          cat > "$RUNNER_TEMP/zizmor.txt" <<'PINS'
          zizmor==1.32.0 --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071
          PINS
          "$RUNNER_TEMP/zizmor/bin/pip" install -q --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --quiet --offline --config .github/zizmor.yml --format github .github/workflows

      - name: Sources (security lint)
        run: python3 -I .github/scripts/security_lint.py

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The rules these check are in docs/CODE-STYLE.md.
      - name: Install the linters
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          cat > "$RUNNER_TEMP/lint.txt" <<'PINS'
          ruff==0.16.9 --hash=sha256:a21713e629d3e5bdb2f5c2def1cc7f04f47fa8e1a7eb0571b4a28e1da64bc728
          shellcheck-py==0.11.0.1 --hash=sha256:1b274df81de5b000ff78db433e7328b87e52e3c38481c60f8e488c3095beef05
          PINS
          "$RUNNER_TEMP/lint/bin/pip" install -q --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/lint.txt"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/lint/bin" actionlint
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
          npm ci --prefix .github/lint --ignore-scripts --no-audit --no-fund

      - name: Python (Ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Shell (ShellCheck)
        run: git ls-files -z '*.sh' ':!vendor' | xargs -0 shellcheck

      # Also runs ShellCheck over each step's script.
      - name: Workflows (actionlint)
        run: actionlint

      - name: JavaScript (ESLint)
        run: .github/lint/node_modules/.bin/eslint -c .github/lint/eslint.config.mjs license-server docs/cards

  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Flutter
        run: |
          version=$(tr -d '[:space:]' < .flutter-version)
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/flutter.tar.xz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$version-stable.tar.xz"
          echo "$(grep -E '^FLUTTER_SHA256_LINUX=' .github/pins.env | cut -d= -f2)  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Rust formatting
        run: cargo fmt --manifest-path native/lumtub_core/Cargo.toml --check

      # rustfmt.toml's import, hex and macro options exist only in nightly
      # rustfmt; stable ignores them. Nightly is used for this check only.
      - name: Rust formatting (Google's rustfmt options)
        env:
          # Pinned so formatting only changes when this date does.
          RUSTFMT_NIGHTLY: nightly-2026-11-26
        run: |
          rustup toolchain install "$RUSTFMT_NIGHTLY" --profile minimal --component rustfmt --no-self-update
          cargo "+$RUSTFMT_NIGHTLY" fmt --manifest-path native/lumtub_core/Cargo.toml --check
          cargo "+$RUSTFMT_NIGHTLY" fmt --manifest-path native/lumtub_core/fuzz/Cargo.toml --check

      - name: C++ formatting (Google's style, .clang-format)
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          cat > "$RUNNER_TEMP/clang-format.txt" <<'PINS'
          clang-format==18.1.3 --hash=sha256:059f2c2e7166f97cf06f78d9bd31d83a9c0416527845cb397296daa43bd2c6e2
          PINS
          "$RUNNER_TEMP/clang-format/bin/pip" install -q --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/clang-format.txt"
          find windows/runner linux/runner \( -name '*.cpp' -o -name '*.cc' -o -name '*.h' \) -exec "$RUNNER_TEMP/clang-format/bin/clang-format" --dry-run --Werror {} +

      - name: Get packages
        run: flutter pub get

      - name: Analyze the Dart sources
        run: flutter analyze

      # 100 columns, from analysis_options.yaml.
      - name: Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Flutter
        run: |
          version=$(tr -d '[:space:]' < .flutter-version)
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/flutter.tar.xz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$version-stable.tar.xz"
          echo "$(grep -E '^FLUTTER_SHA256_LINUX=' .github/pins.env | cut -d= -f2)  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install the Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/lumtub_core
          key: checks-linux

      - name: Clippy
        run: cargo clippy --manifest-path native/lumtub_core/Cargo.toml --release --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path native/lumtub_core/Cargo.toml --release

      - name: Build the Rust core for the Dart tests
        run: |
          cargo build --manifest-path native/lumtub_core/Cargo.toml --release --lib
          echo "LUMTUB_CORE_DLL=$PWD/native/lumtub_core/target/release/liblumtub_core.so" >> "$GITHUB_ENV"

      # iOS starts Python through PyInitConfig; a desktop CPython of the same
      # version checks those calls here, since CI has no iPhone.
      - name: Python start-up through PyInitConfig
        run: |
          set -euo pipefail
          release=$(grep -E '^PYTHON_TEST_RELEASE=' .github/pins.env | cut -d= -f2)
          file=$(grep -E '^PYTHON_TEST_FILE=' .github/pins.env | cut -d= -f2)
          sum=$(grep -E '^PYTHON_TEST_SHA256=' .github/pins.env | cut -d= -f2)
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/$release/${file//+/%2B}"
          echo "$sum  $RUNNER_TEMP/python.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          LUMTUB_TEST_PYTHON_LIBRARY="$RUNNER_TEMP/python/lib/libpython3.14.so.1.0" \
          LUMTUB_TEST_PYTHON_HOME="$RUNNER_TEMP/python" \
          LUMTUB_TEST_CORE="$LUMTUB_CORE_DLL" \
            cargo test --manifest-path native/lumtub_core/Cargo.toml --release --lib python::tests -- --nocapture

      - name: Get packages
        run: flutter pub get

      - name: Dart tests
        run: flutter test

  windows:
    name: Tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content .flutter-version -Raw).Trim()
          $archive = Join-Path $env:RUNNER_TEMP "flutter_windows_$version-stable.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$version-stable.zip" -OutFile $archive
          $expected = ((Select-String -LiteralPath .github/pins.env -Pattern '^FLUTTER_SHA256_WINDOWS=(.+)$').Matches[0].Groups[1].Value).Trim()
          $sum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sum -ne $expected) { throw "The Flutter SDK has SHA-256 $sum; pins.env has $expected." }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          (Join-Path $destination 'flutter/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/lumtub_core
          key: checks-windows

      - name: Rust tests and the core for the Dart tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'native/lumtub_core/Cargo.toml'
          cargo test --manifest-path $manifest --release
          if ($LASTEXITCODE -ne 0) { throw 'Rust core tests failed.' }
          cargo build --manifest-path $manifest --release --lib
          if ($LASTEXITCODE -ne 0) { throw 'Rust core build failed.' }
          $dll = (Resolve-Path 'native/lumtub_core/target/release/lumtub_core.dll').Path
          "LUMTUB_CORE_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get packages
        run: flutter pub get

      - name: Dart tests
        run: flutter test
