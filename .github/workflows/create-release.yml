name: Create YTPlus release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (must match pubspec.yaml, for example 0.1.0)'
        required: true
        type: string

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and create the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must be semantic, for example 0.1.0 or 0.1.0-rc.1" >&2
            exit 1
          }
          pubspec_version=$(sed -n 's/^version: *\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          [[ "$pubspec_version" == "$VERSION" ]] || {
            echo "pubspec.yaml declares release version $pubspec_version, not $VERSION" >&2
            exit 1
          }
          tag="v$VERSION"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 && {
            echo "Tag $tag already exists" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "YTPlus $tag"
          git push origin "$tag"

      - name: Explain the release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows.yml --ref "v${{ inputs.version }}"
          echo 'The tagged Windows build was dispatched.'
          echo 'That workflow builds the ZIP and installer, then creates the GitHub Release with generated release notes.'
