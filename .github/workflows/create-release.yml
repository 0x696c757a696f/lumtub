name: Create YTPlus release

on:
  workflow_dispatch:

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Compute and create the next release tag
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          pubspec_version=$(sed -n 's/^version: *\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          [[ "$pubspec_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "pubspec.yaml must declare a stable semantic version, found: $pubspec_version" >&2
            exit 1
          }
          IFS=. read -r major minor patch <<< "$pubspec_version"
          latest=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -n "$latest" ]]; then
            IFS=. read -r latest_major latest_minor latest_patch <<< "${latest#v}"
            if [[ "$latest_major" == "$major" && "$latest_minor" == "$minor" && "$latest_patch" -ge "$patch" ]]; then
              patch=$((latest_patch + 1))
            fi
          fi
          tag="v$major.$minor.$patch"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 && {
            echo "Tag $tag already exists" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "YTPlus $tag"
          git push origin "$tag"
          echo "Created $tag from pubspec.yaml version $pubspec_version"

      - name: Explain the release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git describe --tags --exact-match)
          gh workflow run windows.yml --ref "$tag"
          echo 'The tagged Windows build was dispatched.'
          echo 'That workflow builds the ZIP and installer, then creates the GitHub Release with generated release notes.'
