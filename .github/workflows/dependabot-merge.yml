name: Merge dependency updates

# Merges a Dependabot pull request once its build has passed. Major version
# bumps of Dart packages are left for review, since they often need code
# changes the build alone cannot judge. Refreshed lockfiles (see
# lockfiles.yml) and newer pinned tools (see upstream.yml) go into main the
# same way, when main has not moved since. Weblate's translation pull
# requests are merged too when they touch nothing but assets/l10n; the
# tests check every translation keeps its placeholders.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,title,author --jq '.[] | select(.author.login == "app/dependabot") | "\(.number)\t\(.title)"' | head -n1)
          if [ -z "$pr" ]; then echo "No open Dependabot pull request for $BRANCH."; exit 0; fi
          number=${pr%%$'\t'*}
          title=${pr#*$'\t'}
          if [[ "$BRANCH" == dependabot/pub/* ]] && [[ "$title" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] && [ "${BASH_REMATCH[1]}" != "${BASH_REMATCH[2]}" ]; then
            echo "#$number is a major Dart package update; left for review."
            exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"

  lockfiles:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'deps/lockfiles' || github.event.workflow_run.head_branch == 'deps/upstream') &&
      github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Bring into main
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$SHA" ]; then echo "$BRANCH moved on; the next build merges it."; exit 0; fi
          if ! git merge-base --is-ancestor HEAD "$SHA"; then echo "main moved on; the next refresh starts from it."; exit 0; fi
          git push origin "$SHA:refs/heads/main"
          git push origin --delete "$BRANCH"

  translations:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'weblate'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$REPO" --author weblate --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -n1)
          if [ -z "$number" ]; then echo "No open Weblate pull request at $SHA."; exit 0; fi
          others=$(gh pr view "$number" --repo "$REPO" --json files --jq '.files[].path' | grep -v '^assets/l10n/[A-Za-z0-9_-]*\.json$' || true)
          if [ -n "$others" ]; then
            echo "#$number also changes files outside assets/l10n; left for review:"
            echo "$others"
            exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --squash --match-head-commit "$SHA"
