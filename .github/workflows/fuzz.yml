name: Fuzz

# Feeds random and mutated input to the core's parsers of data from outside
# (MP4 and WebM streams, AirPlay property lists, PAC scripts, subtitles,
# update signatures) for five minutes each, every night. A crash fails the
# run, keeps the input that caused it as an artifact, and Retry and report
# opens an issue. The corpus grows from night to night through the cache.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['native/lumtub_core/fuzz/**', '.github/workflows/fuzz.yml']

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [mp4_head, webm, bplist, pac, subtitles, update_signature, cast_lan, packs, cast_fragment]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/lumtub_core/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        working-directory: native/lumtub_core
        run: |
          seconds=300
          if [ "${{ github.event_name }}" = pull_request ]; then seconds=30; fi
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$seconds -rss_limit_mb=2048 -timeout=10
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: native/lumtub_core/fuzz/artifacts/${{ matrix.target }}
