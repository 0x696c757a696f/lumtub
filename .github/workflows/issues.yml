name: Issues

# Keeps the issue list tidy without anyone watching it: a new issue that
# breaks the issue rules (.github/scripts/issue_rules.py: opened from a form,
# fields really answered, one problem per issue, a version for bugs) is told
# why and closed, and reopens once its reporter edits it into shape; a bug
# report that came without its log is asked for one and marked `needs info`;
# the mark goes when the reporter answers; an issue still waiting for its
# reporter after 30 days is reminded, and closed 14 days later (reopening is
# one click). Issues from the owner, members and bots are never checked.
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '11 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rules:
    permissions:
      issues: write
    # Only the reporter's own new issue, or their edit or reopening of one
    # these rules closed, is checked.
    if: >-
      github.event_name == 'issues' &&
      github.event.sender.login == github.event.issue.user.login &&
      github.event.issue.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (github.event.action == 'opened' || contains(github.event.issue.labels.*.name, 'invalid'))
    runs-on: ubuntu-24.04
    outputs:
      closed: ${{ steps.check.outputs.closed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Close the issue when it breaks the rules, reopen it when fixed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          STATE: ${{ github.event.issue.state }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/issue_rules.py > "$RUNNER_TEMP/reply.md"
          if [ -s "$RUNNER_TEMP/reply.md" ]; then
            echo closed=true >> "$GITHUB_OUTPUT"
            # An edit that still breaks the rules changes nothing: a closed issue
            # already has its reply, an open one was reopened by the owner.
            if [ "$ACTION" = edited ]; then exit 0; fi
            gh issue edit "$NUMBER" --add-label invalid
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"
            gh issue close "$NUMBER" --reason 'not planned'
          elif [ "$ACTION" != opened ]; then
            gh issue edit "$NUMBER" --remove-label invalid
            if [ "$STATE" = closed ]; then
              gh issue reopen "$NUMBER"
              gh issue comment "$NUMBER" --body 'Thanks, reopened. 谢谢，已重新打开。'
            fi
          fi

  ask-for-log:
    permissions:
      issues: write
    needs: rules
    if: >-
      !cancelled() &&
      needs.rules.outputs.closed != 'true' &&
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-24.04
    steps:
      - name: Ask for the log when it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # The form puts each answer under its "### Label" heading.
          log=$(awk '/^### /{section=$0; next} section ~ /^### Log/' <<< "$BODY" | grep -v '^[[:space:]]*$' | grep -vF '_No response_' || true)
          if [ -n "$log" ]; then exit 0; fi
          gh label create 'needs info' --color FBCA04 --description 'Waiting for the reporter' 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label 'needs info'
          gh issue comment "$NUMBER" --body-file - <<'TEXT'
          Thanks for the report! Could you attach Lumtub's log? It says what went wrong far better than a description can, and holds no passwords or stream addresses.

          In Lumtub: Settings › About › Error log. Or attach the file:
          - Windows: `%LOCALAPPDATA%\Lumtub\logs\lumtub.log`
          - macOS: `~/Library/Application Support/Lumtub/logs/lumtub.log`
          - Linux: `~/.local/share/lumtub/logs/lumtub.log`

          感谢反馈！能附上 Lumtub 的日志吗？它比文字描述更能说明哪里出了问题，里面不含密码和视频地址。在 Lumtub 里：设置 › 关于 › 错误日志，或者直接附上上面路径里的文件。
          TEXT

  answered:
    permissions:
      issues: write
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'needs info')
    runs-on: ubuntu-24.04
    steps:
      - name: The reporter answered
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label 'needs info'
          gh issue edit "$NUMBER" --remove-label stale 2>/dev/null || true

  stale:
    permissions:
      issues: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs info
          days-before-stale: 30
          days-before-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: >-
            This has been waiting for more information for a month. It will be closed in two weeks
            unless there is an answer; it can be reopened at any time.
            这个问题等补充信息已经一个月了，两周内没有回复会自动关闭，之后随时可以重新打开。
          close-issue-reason: not_planned
