name: JS engine benchmark

# Times yt-dlp's JS challenge solver with Deno, QuickJS-ng and rquickjs
# (QuickJS inside Rust), to choose the engine for Android and iOS.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/js-bench/**', '.github/workflows/js-bench.yml']

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the engines
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/deno.zip" https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -q "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/bin"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/bin/qjs" https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-x86_64
          chmod +x "$RUNNER_TEMP/bin/qjs"
          "$RUNNER_TEMP/bin/deno" --version
          "$RUNNER_TEMP/bin/qjs" --help | head -1 || true
          pip install --quiet --upgrade yt-dlp-ejs
          pip show yt-dlp-ejs | head -2
      - name: Build rquickjs
        run: |
          cargo build --release --manifest-path .github/js-bench/rq/Cargo.toml
          grep -A1 'name = "rquickjs"' .github/js-bench/rq/Cargo.lock
      - name: Run
        run: |
          python .github/js-bench/bench.py "$RUNNER_TEMP/work" \
            "deno=$RUNNER_TEMP/bin/deno run --no-prompt --no-remote --no-lock --node-modules-dir=none --no-config {}" \
            "quickjs-ng=$RUNNER_TEMP/bin/qjs --script {}" \
            "rquickjs=.github/js-bench/rq/target/release/rq {}"
          cat "$RUNNER_TEMP/work/summary.md" >> "$GITHUB_STEP_SUMMARY"
