name: Refresh lockfiles

# Dependabot raises direct dependencies only; this moves every package in
# pubspec.lock and Cargo.lock to the newest version the constraints allow,
# except versions released less than a week ago (.github/scripts/cooldown.py),
# takes the newest Chrome Root Store and the newest stable Flutter
# (.flutter-version, read by every build job).
# The result goes to the deps/lockfiles branch and Build checks it; Merge
# dependency updates then brings it into main.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true  # zizmor: ignore[artipacked] this job pushes with git
          ref: main
      - name: Newest Flutter stable
        run: |
          set -euo pipefail
          version=$(curl -sSfL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | jq -r '.current_release.stable as $h | .releases[] | select(.hash == $h) | .version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected Flutter version: $version"; exit 1; }
          echo "$version" > .flutter-version
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"
          echo "Flutter $version"
          # The SDK archives' sums, which the build jobs check (pins.env).
          for pin in linux:LINUX:flutter_linux_$version-stable.tar.xz windows:WINDOWS:flutter_windows_$version-stable.zip \
                     macos:MACOS:flutter_macos_$version-stable.zip macos:MACOS_ARM64:flutter_macos_arm64_$version-stable.zip; do
            IFS=: read -r os key name <<< "$pin"
            sum=$(curl -sSfL "https://storage.googleapis.com/flutter_infra_release/releases/releases_$os.json" | jq -r --arg a "stable/$os/$name" '[.releases[] | select(.archive == $a) | .sha256][0]')
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "No SHA-256 for $name"; exit 1; }
            sed -i -E "s/^FLUTTER_SHA256_$key=.*/FLUTTER_SHA256_$key=$sum/" .github/pins.env
          done
      - name: Flutter
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -sSfL -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "$(grep -E '^FLUTTER_SHA256_LINUX=' .github/pins.env | cut -d= -f2)  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dart packages
        run: flutter pub upgrade
      - name: Rust crates
        run: |
          rustup update stable
          cargo update --manifest-path native/lumtub_core/Cargo.toml
      - name: Hold back releases younger than a week
        run: python3 .github/scripts/cooldown.py
      - name: Chrome Root Store
        run: native/lumtub_core/roots/update-chrome.sh
      - name: Push and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Lockfiles are current."
            exit 0
          fi
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c deps/lockfiles
          git add -A native/lumtub_core/roots .flutter-version .github/pins.env
          git commit -qam "Refresh lockfiles"
          git push --force origin deps/lockfiles
          gh workflow run build.yml --ref deps/lockfiles
