name: Packages

# After a release: Flatpak bundles on the release, and the release sent to
# WinGet, Scoop and the AUR. A pull request touching packaging/ builds the
# Flatpak of the latest release, to test the manifest, and sends nothing.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, such as v0.2.49-17fb352 (empty: the latest release)'
        required: false
  pull_request:
    branches: [main]
    paths: ['packaging/**', '.github/workflows/packages.yml']

concurrency:
  group: packages-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manifests:
    # A Build run that published a release ran on its tag (pushed, or
    # dispatched by Create release): a fork's pull request from a branch
    # named like a tag is not one.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      full: ${{ steps.tag.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - name: Which release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case $EVENT in
            workflow_run) tag=$RUN_TAG ;;
            *) tag=${INPUT_TAG:-$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)} ;;
          esac
          # The Build run of a tag that published no release (it failed
          # before, or the tag is not a release) leaves nothing to do.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "full=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Fill in the manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: packaging/update-manifests.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manifests
          path: packaging
          include-hidden-files: true

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            package_arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            package_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE: Lumtub_${{ needs.manifests.outputs.full }}_linux-${{ matrix.package_arch }}.flatpak
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: manifests
          path: packaging
      - name: Install Flatpak and flatpak-builder
        run: |
          # On the runner itself: inside a container, flatpak's updates of the
          # runtimes fail on the container's overlay file system.
          # bubblewrap needs user namespaces, which Ubuntu's AppArmor restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream desktop-file-utils xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the metadata
        run: |
          appstreamcli validate --no-net --explain packaging/flatpak/io.github.lumtub.lumtub.metainfo.xml
          desktop-file-validate packaging/flatpak/io.github.lumtub.lumtub.desktop
      - name: Build the bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --arch="$ARCH" --default-branch=stable --repo=repo build packaging/flatpak/io.github.lumtub.lumtub.yml
          flatpak build-bundle --arch="$ARCH" --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$BUNDLE" io.github.lumtub.lumtub stable
          ls -l "$BUNDLE"
      - name: Flathub's linter
        if: matrix.arch == 'x86_64'
        run: |
          # The checks Flathub runs on a submission, on the manifest and on the built repo.
          flatpak install -y --user --noninteractive flathub org.flatpak.Builder
          # Screenshots are mirrored by Flathub's own build, not by this one.
          local_only='appstream-external-screenshot-url|appstream-screenshots-not-mirrored-in-ostree'
          status=0
          for target in "manifest packaging/flatpak/io.github.lumtub.lumtub.yml" "repo repo"; do
            flatpak run --command=flatpak-builder-lint org.flatpak.Builder --exceptions $target > lint.json || true
            # No output at all means nothing to report.
            cat lint.json
            if python3 -c 'import json,re,sys; t=open("lint.json").read().strip(); e=[x for x in (json.loads(t) if t else {}).get("errors",[]) if not re.fullmatch(sys.argv[1],x)]; print("\n".join(e)); sys.exit(1 if e else 0)' "$local_only"; then :; else status=1; fi
          done
          exit $status
      - name: Start it
        run: |
          # Installs the bundle and starts Lumtub on a virtual display for
          # 20 seconds: no library it links may be missing.
          set +e
          flatpak install -y --user --noninteractive "$BUNDLE"
          timeout 20 xvfb-run -a flatpak run --user io.github.lumtub.lumtub > run.log 2>&1
          code=$?
          cat run.log
          set -e
          if grep -E 'error while loading shared libraries|cannot open shared object file' run.log; then
            echo "::error::A library is missing in the Flatpak"
            exit 1
          fi
          echo "Exit code $code"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: Lumtub_*.flatpak
          compression-level: 0

  attach:
    name: Flatpak on the release
    needs: [manifests, flatpak]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The update signing key lives in the "release" environment.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: native/lumtub_core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: flatpak-*
          path: dist
          merge-multiple: true
      - name: Sign the bundles
        env:
          LUMTUB_UPDATE_KEY: ${{ secrets.LUMTUB_UPDATE_KEY }}
        run: |
          # A .sig (Ed25519 + ML-DSA-65) next to each bundle, like every other package of the release.
          if [[ -z "$LUMTUB_UPDATE_KEY" ]]; then
            echo "::error::The LUMTUB_UPDATE_KEY secret is not set; the bundles would go out unsigned."
            exit 1
          fi
          rustup update stable
          cargo run --quiet --manifest-path native/lumtub_core/Cargo.toml --bin lumtub-sign -- dist/*.flatpak
          ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.manifests.outputs.tag }}
        run: gh release upload "$TAG" dist/*.flatpak dist/*.flatpak.sig --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Send to ${{ matrix.target }}
    # After the Flatpak built and passed Flathub's linter.
    needs: [manifests, flatpak]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target: [winget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: manifests
          path: packaging
      - env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          # Needs its secret; without it this release is not sent there.
          if [[ -z $GH_TOKEN ]]; then
            echo "::notice::No PACKAGES_TOKEN; not sent to $TARGET."
            exit 0
          fi
          bash packaging/publish.sh "$TARGET"

  aur:
    name: Send to the AUR
    needs: manifests
    runs-on: ubuntu-24.04
    # Arch's own OpenSSH, the newest there is, so AUR_SSH_KEY may also be a
    # post-quantum hybrid key (ssh-keygen -t mldsa44-ed25519) where the
    # runner's OpenSSH would not know it.
    container:
      # Arch is a rolling release: a pinned digest would hold back the OpenSSH this job wants.
      image: archlinux:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Install the tools
        run: |
          pacman -Syu --noconfirm --needed git openssh python
          ssh -V
          echo "Key types: $(ssh -Q key | paste -sd' ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: manifests
          path: packaging
      - if: github.event_name != 'pull_request'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_NAME: ${{ vars.AUR_NAME }}
          AUR_EMAIL: ${{ vars.AUR_EMAIL }}
        run: |
          # Needs its secret; without it this release is not sent there.
          if [[ -z $AUR_SSH_KEY ]]; then
            echo "::notice::No AUR_SSH_KEY; not sent to the AUR."
            exit 0
          fi
          bash packaging/publish.sh aur
