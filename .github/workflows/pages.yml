name: Website

# The project website on GitHub Pages: a Leptos app compiled to WebAssembly
# with Trunk, from website/, using the README screenshots in docs/.
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/screenshots/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: website
          cache-bin: true
      - name: Install Trunk
        run: command -v trunk >/dev/null || cargo install trunk --version 0.22.1 --locked
      - name: Build
        working-directory: website
        run: trunk build --release --locked
      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
