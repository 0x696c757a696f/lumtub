name: Probe Microsoft translator
# Temporary: checks the keyless Microsoft address from a runner. Removed again.
on:
  push:
    branches: [claude/project-thread-95y567]
    paths: ['.github/workflows/probe-ms.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Ask edge.microsoft.com/translate/translatetext
        run: |
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36 Edg/142.0.0.0'
          for to in zh-Hans de; do
            curl -sS -m 30 -w '\nHTTP %{http_code}\n' -X POST "https://edge.microsoft.com/translate/translatetext?to=$to&isEnterpriseClient=false" \
              -H "User-Agent: $ua" -H 'Content-Type: application/json' \
              --data '["Hello world, how are you today?","Subtitles and comments can be translated here."]'
          done
          echo '--- without a browser User-Agent'
          curl -sS -m 30 -w '\nHTTP %{http_code}\n' -X POST 'https://edge.microsoft.com/translate/translatetext?to=zh-Hans&isEnterpriseClient=false' \
            -H 'Content-Type: application/json' --data '["Hello world"]'
          echo '--- old token address'
          curl -sS -m 30 -o /dev/null -w 'HTTP %{http_code}\n' https://edge.microsoft.com/translate/auth
