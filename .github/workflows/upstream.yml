name: Upstream updates

# Once a week, looks for newer versions of what .github/pins.env pins (libmpv for
# Linux, FFmpeg for macOS, appimagetool) and of libmpv for Android (Predidit's
# jars) and macOS (MPVKit), pinned in their vendor/ copies. Those go to the deps/upstream
# branch, Build checks them there, smoke tests included, and Merge
# dependency updates brings them into main once it passes. The media_kit
# copies under vendor/ carry Lumtub's own changes, so a newer media_kit
# opens an issue instead.
#
# Every day, after lumtub-media-builds' daily run (04:47) has built the iOS
# libmpv of main's recipe, the iOS libmpv alone is pinned too, so a recipe
# change is in use the next day; only iOS is built for it.
on:
  schedule:
    - cron: '37 5 * * 2'
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true  # zizmor: ignore[artipacked] this job pushes with git
          ref: main
      - name: Look for newer versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAILY: ${{ github.event.schedule == '17 8 * * *' }}
        run: |
          set -euo pipefail
          if [[ "$DAILY" != true ]]; then
            python3 .github/scripts/upstream.py
            exit 0
          fi
          # The weekly updates still waiting on deps/upstream are not
          # pushed over; they carry the iOS libmpv along when they merge.
          ahead=$(gh api "repos/$GH_REPO/compare/main...deps/upstream" --jq .ahead_by 2>/dev/null || echo 0)
          if [[ "$ahead" != 0 ]]; then
            echo "deps/upstream still waits to merge; the iOS libmpv is left to it."
            exit 0
          fi
          python3 .github/scripts/upstream.py ios
      - name: Push and build
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY: ${{ github.event.schedule == '17 8 * * *' }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c deps/upstream
          git commit -qaF "$RUNNER_TEMP/upstream-commit.txt"
          git push --force origin deps/upstream
          # The daily run changes only the iOS libmpv: only iOS is built.
          if [[ "$DAILY" == true ]]; then
            gh workflow run build.yml --ref deps/upstream -f platforms=ios
          else
            gh workflow run build.yml --ref deps/upstream
          fi
      - name: Report what needs reading
        if: github.event.schedule != '17 8 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title='Newer media_kit to merge into vendor/'
          issue=$(gh issue list --state open --label automation --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          notes="$RUNNER_TEMP/upstream-notes.md"
          if [ ! -s "$notes" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment 'vendor/ is current again.'; fi
            exit 0
          fi
          body=$(printf 'These packages are vendored with Lumtub'"'"'s changes (see each LUMTUB.md), so they are not updated by themselves:\n\n%s\n' "$(cat "$notes")")
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh label create automation --color BFD4F2 --description 'Reported by the repository automation' 2>/dev/null || true
            gh issue create --title "$title" --label automation --body "$body"
          fi
