name: Build YTPlus Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify latest shinchiro x86_64-v3 libmpv update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'YTPlus-GitHub-Actions'
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-v3-.*\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'Latest release has no x86_64-v3 development archive.' }
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            throw "Latest libmpv asset has no SHA-256 digest: $($asset.name)"
          }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $downloadUri = [uri]$asset.browser_download_url
          if ($downloadUri.Scheme -ne 'https' -or $downloadUri.Host -ne 'github.com') {
            throw "Unexpected libmpv download host: $downloadUri"
          }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extractDir = Join-Path $env:RUNNER_TEMP 'ytplus-mpv-check'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Invoke-WebRequest -Uri $downloadUri -OutFile $archive -Headers $headers
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "SHA-256 mismatch for $($asset.name)" }
          & tar.exe -xf $archive -C $extractDir 2>$null
          $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse |
            Select-Object -First 1
          if (-not $library) {
            $sevenZip = Join-Path $env:RUNNER_TEMP '7zr.exe'
            Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip
            & $sevenZip x -y "-o$extractDir" $archive | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the latest libmpv archive.' }
            $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse |
              Select-Object -First 1
          }
          if (-not $library) { throw 'The latest libmpv archive does not contain libmpv-2.dll.' }
          Write-Host "Verified $($release.tag_name): $($asset.name), SHA-256, and $($library.FullName)"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # A corrupted hosted cache left consecutive builds stuck before
          # Flutter starts. A clean GitHub runner is slower on first setup but
          # reliably reaches analysis and the Windows build.
          cache: false

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name ytplus .

      - name: Remove Flutter's generated sample test
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'test/widget_test.dart') {
            Remove-Item -LiteralPath 'test/widget_test.dart'
          }

      - name: Get packages
        run: flutter pub get

      - name: Analyze sources
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Release build
        run: flutter build windows --release

      - name: Replace bundled libmpv with the latest DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $env:RUNNER_TEMP 'ytplus-mpv-check'
          $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse |
            Select-Object -First 1
          if (-not $library) { throw 'Verified libmpv-2.dll is missing.' }
          $destination = Join-Path 'build/windows/x64/runner/Release' 'libmpv-2.dll'
          if (-not (Test-Path -LiteralPath $destination)) {
            throw 'The release build does not contain media_kit libmpv-2.dll to replace.'
          }
          Copy-Item -LiteralPath $library.FullName -Destination $destination -Force
          $sourceHash = (Get-FileHash -LiteralPath $library.FullName -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          if ($sourceHash -ne $targetHash) { throw 'The bundled libmpv replacement did not verify.' }
          Write-Host "Replaced the bundled DLL with $($library.FullName)"

      - name: Package Windows distribution
        shell: pwsh
        run: |
          $package = 'YTPlus-Windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Recurse -Force 'build/windows/x64/runner/Release/*' $package
          Copy-Item LICENSE, NOTICE $package
          Compress-Archive -Path "$package/*" -DestinationPath 'YTPlus_Windows_x64.zip'

      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: YTPlus-Windows-x64
          path: YTPlus_Windows_x64.zip
