name: Build YTPlus Windows

on:
  workflow_dispatch:
    inputs:
      libmpv:
        description: 'libmpv to ship: latest shinchiro build, or the one media_kit bundles'
        type: choice
        options: [latest, media_kit]
        default: latest
  push:
    branches: [main]
    # A pushed tag such as v0.2.0 also publishes a GitHub release.
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    env:
      FLUTTER_VERSION: 3.47.7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The bundled DLL is the baseline x86-64 build, which runs on every
      # x86-64 CPU; the app downloads the faster x86-64-v3 build at runtime
      # when the CPU supports AVX2.
      - name: Verify latest shinchiro x86_64 libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'YTPlus-GitHub-Actions'
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
            -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-(?!v3-).*\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'Latest release has no x86_64 development archive.' }
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            throw "Latest libmpv asset has no SHA-256 digest: $($asset.name)"
          }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $downloadUri = [uri]$asset.browser_download_url
          if ($downloadUri.Scheme -ne 'https' -or $downloadUri.Host -ne 'github.com') {
            throw "Unexpected libmpv download host: $downloadUri"
          }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extractDir = Join-Path $env:RUNNER_TEMP 'ytplus-mpv-check'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Invoke-WebRequest -Uri $downloadUri -OutFile $archive -Headers $headers
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "SHA-256 mismatch for $($asset.name)" }
          & tar.exe -xf $archive -C $extractDir 2>$null
          $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse |
            Select-Object -First 1
          if (-not $library) {
            $sevenZip = Join-Path $env:RUNNER_TEMP '7zr.exe'
            Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $sevenZip
            & $sevenZip x -y "-o$extractDir" $archive | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the latest libmpv archive.' }
            $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse |
              Select-Object -First 1
          }
          if (-not $library) { throw 'The latest libmpv archive does not contain libmpv-2.dll.' }
          if ($release.tag_name -notmatch '^[0-9A-Za-z._]{1,40}$') { throw "Unexpected libmpv tag: $($release.tag_name)" }
          $release.tag_name | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'libmpv-tag.txt') -Encoding ascii -NoNewline
          Write-Host "Verified $($release.tag_name): $($asset.name), SHA-256, and $($library.FullName)"

      - name: Install Flutter stable SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "flutter_windows_$env:FLUTTER_VERSION-stable.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          Invoke-WebRequest `
            -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $flutterBin = Join-Path $destination 'flutter/bin'
          if (-not (Test-Path -LiteralPath $flutterBin)) { throw 'Flutter SDK did not contain flutter/bin.' }
          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get packages
        run: flutter pub get

      - name: Analyze sources
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Tag builds use the tag (v0.2.0 -> 0.2.0); other builds add the
      # commit so a test build is never mistaken for a release.
      - name: Work out the version
        shell: bash
        run: |
          base=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$base-${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "YTPLUS_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - name: Release build
        # The optional Google sign-in client comes from repository secrets;
        # without them the app asks the user for their own client.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.YTPLUS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.YTPLUS_GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: flutter build windows --release --dart-define=YTPLUS_VERSION="$YTPLUS_VERSION" --dart-define=YTPLUS_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=YTPLUS_GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"

      - name: Check that the video plugin is delay-loaded
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # windows/runner/libmpv_loader.cpp only works if media_kit_video_plugin.dll
          # (which imports libmpv-2.dll) loads after main() starts.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found.' }
          $imports = & $dumpbin /imports 'build/windows/x64/runner/Release/ytplus.exe' | Out-String
          $delayed = $imports.IndexOf('Section contains the following delay load imports')
          if ($delayed -lt 0 -or $imports.IndexOf('media_kit_video_plugin.dll', $delayed) -lt 0) {
            throw 'media_kit_video_plugin.dll is not delay-loaded.'
          }
          Write-Host 'media_kit_video_plugin.dll is delay-loaded.'

      - name: Replace bundled libmpv with the latest DLL
        if: github.event_name != 'workflow_dispatch' || inputs.libmpv == 'latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extractDir = Join-Path $env:RUNNER_TEMP 'ytplus-mpv-check'
          $library = Get-ChildItem -LiteralPath $extractDir -Filter 'libmpv-2.dll' -File -Recurse |
            Select-Object -First 1
          if (-not $library) { throw 'Verified libmpv-2.dll is missing.' }
          $destination = Join-Path 'build/windows/x64/runner/Release' 'libmpv-2.dll'
          if (-not (Test-Path -LiteralPath $destination)) {
            throw 'The release build does not contain media_kit libmpv-2.dll to replace.'
          }
          Copy-Item -LiteralPath $library.FullName -Destination $destination -Force
          $sourceHash = (Get-FileHash -LiteralPath $library.FullName -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          if ($sourceHash -ne $targetHash) { throw 'The bundled libmpv replacement did not verify.' }
          # Read by lib/libmpv_updates.dart to decide whether a download is newer.
          $tag = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'libmpv-tag.txt')
          "$tag`nx86_64`n" | Out-File -FilePath 'build/windows/x64/runner/Release/libmpv-version.txt' -Encoding ascii -NoNewline
          Write-Host "Replaced the bundled DLL with $($library.FullName)"

      - name: Package Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'YTPlus-Windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Recurse -Force 'build/windows/x64/runner/Release/*' $package
          Copy-Item LICENSE, NOTICE $package
          Compress-Archive -Path "$package/*" -DestinationPath "YTPlus_Windows_x64_$env:YTPLUS_VERSION.zip"

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path -LiteralPath $default)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = Get-Item -LiteralPath $default
          }
          $source = (Resolve-Path 'YTPlus-Windows-x64').Path
          $output = Join-Path (Get-Location) 'installer'
          & $iscc.Source "/DAppVersion=$env:YTPLUS_VERSION" "/DSourceDir=$source" "/DOutputDir=$output" 'windows/installer/ytplus.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          Move-Item (Join-Path $output 'YTPlus_Setup_x64.exe') "YTPlus_Setup_x64_$env:YTPLUS_VERSION.exe"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: YTPlus-Windows-x64
          path: YTPlus_Windows_x64_*.zip

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: YTPlus-Setup-x64
          path: YTPlus_Setup_x64_*.exe

  # Only this job can write to the repository, and only for version tags.
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "YTPlus $TAG" --generate-notes
