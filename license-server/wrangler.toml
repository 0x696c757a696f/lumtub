# The deploy workflow (.github/workflows/license-server.yml) fills in the
# KV namespace id and sets the secrets; see license-server/README.md.
name = "lumtub-license"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[kv_namespaces]]
binding = "LICENSES"
id = "KV_NAMESPACE_ID"

# The 爱发电 plan that is the learning pack: other sponsorships get no
# code. Not a secret, so it lives here (comma-separated for more).
[vars]
AFDIAN_PLANS = "548a65dee44b11f193bd52540025c377"

# revoked.txt is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true
