[package]
name = "lumtub_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native helpers Lumtub calls through dart:ffi"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

# Android's own certificate check runs in the JVM: tls.rs hands the
# verifier the app's context (MainActivity.initTls).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }

# rquickjs ships no prebuilt bindings for the phone targets; bindgen makes
# them from QuickJS's header at build time (needs libclang).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.7.0", default-features = false, features = ["tokio", "native_crypto"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["http2", "gzip", "brotli", "deflate", "socks", "system-proxy", "rustls-no-provider"] }
# Every HTTPS connection the core makes is rustls with aws-lc-rs, which
# offers the X25519MLKEM768 hybrid first (tls.rs). ring stays for AirPlay.
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
webpki-root-certs = "1"
bytes = "1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "macros", "sync"] }
ml-dsa = { version = "0.1.1", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
zeroize = "1.9.1"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
getrandom = "0.4.3"
curve25519-dalek = { version = "5", default-features = false }
num-bigint = "0.5"
ring = "0.17"
whatlang = "0.18"
# QuickJS inside the core, for yt-dlp's challenge solver (js.rs).
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
