# cargo deny check: known vulnerabilities and where crates come from.
[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Unmaintained crates are reported, but only the ones Lumtub uses directly fail.
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
