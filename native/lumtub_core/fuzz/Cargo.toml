[package]
name = "lumtub_core_fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1"
lumtub_core = { path = ".." }

# Its own workspace, so cargo-fuzz's nightly-only flags stay out of the core.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mp4_head"
path = "fuzz_targets/mp4_head.rs"
test = false
doc = false
bench = false

