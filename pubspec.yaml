name: ytplus
description: A lightweight native Windows YouTube player built with Flutter and libmpv.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: 1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_video: 1.0.5
  path_provider: ^2.1.5
  http: ^1.5.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
