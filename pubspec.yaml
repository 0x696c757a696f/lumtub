name: lumtub
description: A lightweight native Windows YouTube player built with Flutter and libmpv.
publish_to: none
version: 0.2.41+43

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path_provider: ^2.1.5
  http: ^1.5.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# A copy of media_kit_video with one Windows fix; see vendor/media_kit_video/LUMTUB.md.
dependency_overrides:
  # A copy of media_kit that lists audio devices on Linux only with a
  # PipeWire server running; see vendor/media_kit/LUMTUB.md.
  media_kit:
    path: vendor/media_kit
  media_kit_video:
    path: vendor/media_kit_video
  # A copy of media_kit_libs_windows_video that can build for Windows ARM64.
  media_kit_libs_windows_video:
    path: vendor/media_kit_libs_windows_video
  # Newer libmpv than media-kit ships: Android from Predidit's builds, macOS
  # and iOS linked from MPVKit; see each LUMTUB.md.
  media_kit_libs_android_video:
    path: vendor/media_kit_libs_android_video
  media_kit_libs_macos_video:
    path: vendor/media_kit_libs_macos_video
  media_kit_libs_ios_video:
    path: vendor/media_kit_libs_ios_video

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    # yt-dlp's challenge plugin for Android and iOS (lib/js_challenge_plugin.dart).
    - python/lumtub_jsc.py
    # Settings › Appearance › App icon (lib/windows_shell.dart).
    - assets/app_icons/
    # Built-in skins and the template users start from (skins/README.md).
    - skins/rice-paper/
    - skins/candlelight/
    - skins/ink-bamboo/
    - skins/rime/
    - skins/pine-soot/
    - skins/night-voyage/
    - skins/dusk-hills/
    - skins/falling-petals/
    - skins/sandstone/
    - skins/high-contrast/
    - skins/aero/
    - skins/ocean/
    - skins/meadow/
    - skins/city/
    - skins/azure/
    - skins/aquarium/
    - skins/aurora/
    - skins/chrome/
    - skins/candy/
    - skins/disc/
    - skins/messenger/
    - skins/player/
    - skins/desktop/
    - skins/sixteen/
    - skins/onebit/
    - skins/platinum/
    - skins/pinstripe/
    - skins/silver/
    - skins/metal/
    - skins/holo/
    - skins/paper/
    - skins/linen/
    - skins/shelf/
    - skins/handheld/
    - skins/template/
  fonts:
    # One bundled default face keeps the Windows package small (SIL OFL 1.1,
    # assets/fonts/OFL.txt). Flutter uses this Regular face for every weight;
    # Windows fonts remain the fallback for characters it does not include.
    - family: Noto Sans CJK SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
    # The same face's proportional curly quotes, cut out with fontTools.
    - family: Lumtub Quotes
      fonts:
        - asset: assets/fonts/LumtubQuotes-Regular.ttf
    # Display faces for the built-in skins (SIL OFL 1.1, skins/fonts/OFL-*.txt).
    # Baloo 2 and Exo 2 are cut to one weight and Latin letters.
    - family: Audiowide
      fonts:
        - asset: skins/fonts/Audiowide-Regular.ttf
    - family: VT323
      fonts:
        - asset: skins/fonts/VT323-Regular.ttf
    - family: Silkscreen
      fonts:
        - asset: skins/fonts/Silkscreen-Regular.ttf
    - family: Press Start 2P
      fonts:
        - asset: skins/fonts/PressStart2P-Regular.ttf
    - family: Baloo 2
      fonts:
        - asset: skins/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Exo 2
      fonts:
        - asset: skins/fonts/Exo2-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    # Phosphor icons (MIT, assets/fonts/phosphor/LICENSE).
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: Phosphor Fill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
