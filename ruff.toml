# Python follows Google's Python style guide, checked by Ruff
# (docs/CODE-STYLE.md). 100 columns, like the Rust and Kotlin code.
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "B",        # bugbear
  "I",        # import order
  "N",        # naming
  "UP",       # newer syntax where the target allows it
  "SIM",      # simpler forms
  "PLE", "PLW",
  "RUF",
  "A",        # shadowed builtins
  "BLE",      # blind except: a catch-all says why
  # Security checks that matter in scripts: exec and eval, pickle, unsafe
  # YAML, shell=True, weak hashes. Subprocess and urlopen checks are left
  # out: every script runs fixed commands and URLs.
  "S102", "S301", "S307", "S324", "S506", "S602", "S604", "S605",
]
ignore = [
  # Text in other languages is data (parsers, titles, translations).
  "RUF001", "RUF002", "RUF003",
]

[format]
quote-style = "preserve"
