<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Download · Lumtub</title>
<link rel="icon" href="/lumtub/favicon.png">
<style>
@font-face { font-family: "Geist"; src: url("/lumtub/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --bg: #fafafa; --text: #09090b; --muted: #52525b; --line: #e4e4e7; --accent: #e53935; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #181818; --text: #fafafa; --muted: #a1a1aa; --line: #313131; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Geist", system-ui, sans-serif; text-align: center; padding: 24px 16px; }
img { display: block; margin: 0 auto 24px; border-radius: 16px; }
h1 { font-size: 28px; line-height: 36px; font-weight: 600; margin: 0 0 12px; text-wrap: balance; overflow-wrap: anywhere; }
p { font-size: 16px; line-height: 24px; color: var(--muted); margin: 0 0 32px; text-wrap: pretty; }
a.btn { display: inline-flex; gap: 8px; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
<img src="/lumtub/icon.png" alt="" width="80" height="80">
<h1 id="title">Downloading Lumtub…</h1>
<p id="note">The newest version starts downloading in a moment. 正在下载最新版本。</p>
<a class="btn" id="link" href="https://github.com/0x696c757a696f/lumtub/releases/latest">All downloads · 全部下载</a>
</main>
<script>
// /lumtub/get/?windows-x64-v3-setup.exe sends the browser to the newest
// release's Lumtub_<version>_windows-x64-v3-setup.exe, so links to it never
// go stale and no release needs extra copies of its files.
(async () => {
  const releases = "https://github.com/0x696c757a696f/lumtub/releases/latest";
  const wanted = decodeURIComponent(location.search.slice(1));
  const fail = (title, note) => {
    document.getElementById("title").textContent = title;
    document.getElementById("note").textContent = note;
  };
  if (!/^[a-z0-9-]+(-setup\.exe|\.zip|\.AppImage|\.flatpak|\.dmg|\.apk|\.ipa|\.tipa)$/.test(wanted)) {
    fail("Pick your download", "This link doesn't name a Lumtub package. 请在发布页选择要下载的文件。");
    return;
  }
  document.getElementById("title").textContent = "Downloading " + wanted;
  try {
    const answer = await fetch("https://api.github.com/repos/0x696c757a696f/lumtub/releases/latest", {
      headers: { Accept: "application/vnd.github+json" },
    });
    if (!answer.ok) throw new Error(String(answer.status));
    const release = await answer.json();
    const asset = (release.assets || []).find((a) => a.name.endsWith("_" + wanted));
    if (!asset) {
      fail("Not in this release", wanted + " isn't part of the newest release. 最新版本里没有这个文件，请在发布页选择。");
      return;
    }
    const link = document.getElementById("link");
    link.href = asset.browser_download_url;
    link.textContent = "Download " + asset.name;
    location.replace(asset.browser_download_url);
  } catch (e) {
    location.replace(releases);
  }
})();
</script>
</body>
</html>
